name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: [web/**, "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: kcsu-admin
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/kcsu-admin/admin/admin:${{ github.sha }}
  WIF_PROVIDER: projects/443929654886/locations/global/workloadIdentityPools/github/providers/kcsu-admin-repo
  DEPLOY_SA: github-deploy@kcsu-admin.iam.gserviceaccount.com
  SERVE_SA: admin-serve@kcsu-admin.iam.gserviceaccount.com
  LOOKUP_SYNC_SA: lookup-sync@kcsu-admin.iam.gserviceaccount.com
  PUBSUB_TOPIC: projects/kcsu-admin/topics/lookup-group-members

jobs:
  lint:
    uses: ./.github/workflows/rust.yml

  deploy:
    needs: lint # never deploy code that fails fmt/clippy
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy service admin
        run: >
          gcloud run deploy admin
          --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          --service-account="$SERVE_SA"
          --no-allow-unauthenticated

      - name: Deploy job lookup-sync
        run: >
          gcloud run jobs deploy lookup-sync
          --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          --command=/lookup-sync
          --service-account="$LOOKUP_SYNC_SA"
          --set-secrets=CAMBRIDGE_UIS_API_KEY=lookup-client-id:latest,CAMBRIDGE_UIS_API_SECRET=lookup-client-secret:latest
          --set-env-vars=PUBSUB_TOPIC="$PUBSUB_TOPIC"
          --task-timeout=5m --max-retries=1
