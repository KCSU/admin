name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: [web/**, "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: kcsu-admin
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/kcsu-admin/admin/admin:${{ github.sha }}
  WIF_PROVIDER: projects/443929654886/locations/global/workloadIdentityPools/github/providers/kcsu-admin-repo
  DEPLOY_SA: github-deploy@kcsu-admin.iam.gserviceaccount.com
  SERVE_SA: admin-serve@kcsu-admin.iam.gserviceaccount.com
  LOOKUP_SYNC_SA: lookup-sync@kcsu-admin.iam.gserviceaccount.com
  ALERTING_SA: alerting@kcsu-admin.iam.gserviceaccount.com
  PUBSUB_TOPIC: projects/kcsu-admin/topics/lookup-group-members
  ALERTS_TOPIC: projects/kcsu-admin/topics/alerts

jobs:
  lint:
    uses: ./.github/workflows/rust.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [lint, build]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy service admin
        run: >
          gcloud run deploy admin
          --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          --service-account="$SERVE_SA"
          --no-allow-unauthenticated

      - name: Deploy service alerting
        run: >
          gcloud run deploy alerting
          --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          --command=/alerting
          --service-account="$ALERTING_SA"
          --set-secrets=CHAT_WEBHOOK_URL=chat-alerts-webhook:latest
          --set-env-vars=GOOGLE_CLOUD_PROJECT="$PROJECT"
          --no-allow-unauthenticated

      - name: Deploy job lookup-sync
        run: >
          gcloud run jobs deploy lookup-sync
          --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          --command=/lookup-sync
          --service-account="$LOOKUP_SYNC_SA"
          --set-secrets=CAMBRIDGE_UIS_API_KEY=lookup-client-id:latest,CAMBRIDGE_UIS_API_SECRET=lookup-client-secret:latest
          --set-env-vars=PUBSUB_TOPIC="$PUBSUB_TOPIC",ALERTS_TOPIC="$ALERTS_TOPIC",GOOGLE_CLOUD_PROJECT="$PROJECT"
          --task-timeout=5m --max-retries=1
