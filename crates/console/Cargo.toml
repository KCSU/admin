[package]
name = "console"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
common = { path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6.11", features = ["fs"] }
